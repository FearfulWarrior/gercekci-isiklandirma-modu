name: Build Gercekci Isiklandirma Modu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build Forge mod
        run: gradle --no-daemon build
      - name: Prepare JAR with requested filename
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" "Gerçekçi Işıklandırma Modu 0.1.0.jar"
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gercekci-isiklandirma-0.1.0
          path: "Gerçekçi Işıklandırma Modu 0.1.0.jar"
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct JAR download
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-jar]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Gerçekçi Işıklandırma Modu 0.1.0 (build ${{ github.run_number }})"
          body: |
            Minecraft Java 1.20.1 + Forge 47.2.0 test build.
            Compiled by GitHub Actions using Java 17.
            This build has not been tested in-game by the workflow.
          files: "Gerçekçi Işıklandırma Modu 0.1.0.jar"
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

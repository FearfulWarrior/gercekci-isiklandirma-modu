name: Build Gercekci Isiklandirma Modu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build Forge mod
        run: gradle --no-daemon build
      - name: Verify packaged JAR resources
        run: |
          python - <<'PY'
          import glob, json, os, struct, zipfile, zlib
          jars = [p for p in glob.glob("build/libs/*.jar") if not p.endswith("-sources.jar")]
          assert len(jars) == 1, f"Expected one distributable JAR, found: {jars}"
          jar = jars[0]
          required = [
              "META-INF/mods.toml",
              "assets/gercekciisik/light/emitters.json",
              "assets/gercekciisik/models/block/traditional_panel.json",
              "assets/gercekciisik/models/block/modern_panel.json",
              "assets/gercekciisik/blockstates/traditional_fluorescent.json",
              "assets/gercekciisik/blockstates/modern_fluorescent.json",
              "assets/gercekciisik/textures/item/traditional_fluorescent.png",
              "assets/gercekciisik/textures/item/modern_fluorescent.png",
              "assets/gercekciisik/textures/item/remote.png",
              "tr/alpegonya/gercekciisik/LampBlock.class",
              "tr/alpegonya/gercekciisik/LampBlockEntity.class",
              "tr/alpegonya/gercekciisik/client/LampControlScreen.class",
              "tr/alpegonya/gercekciisik/client/BrightnessModeButton.class",
              "tr/alpegonya/gercekciisik/ConfigurableLightBlock.class",
              "tr/alpegonya/gercekciisik/AdjustableLightBlockEntity.class",
              "assets/gercekciisik/blockstates/square_spot.json",
              "assets/gercekciisik/blockstates/round_spot.json",
              "assets/gercekciisik/blockstates/traditional_ring_light.json",
              "assets/gercekciisik/blockstates/modern_ring_light.json",
              "assets/gercekciisik/blockstates/horizontal_led_strip.json",
              "assets/gercekciisik/blockstates/vertical_led_strip.json",
              "assets/gercekciisik/models/block/square_spot.json",
              "assets/gercekciisik/models/block/round_spot.json",
              "assets/gercekciisik/models/block/traditional_ring_light.json",
              "assets/gercekciisik/models/block/modern_ring_light.json",
              "assets/gercekciisik/models/block/horizontal_led_strip.json",
              "assets/gercekciisik/models/block/vertical_led_strip_wall.json",
              "assets/gercekciisik/models/block/vertical_led_strip_pendant.json",
              "assets/gercekciisik/textures/block/ring_housing.png",
              "assets/gercekciisik/textures/gui/color_wheel.png",
              "assets/gercekciisik/models/block/vertical_led_strip.json",
              "assets/gercekciisik/models/item/vertical_led_strip.json",
              "data/gercekciisik/loot_tables/blocks/traditional_fluorescent.json",
              "data/gercekciisik/loot_tables/blocks/modern_fluorescent.json",
              "data/gercekciisik/loot_tables/blocks/square_spot.json",
              "data/gercekciisik/loot_tables/blocks/round_spot.json",
              "data/gercekciisik/loot_tables/blocks/traditional_ring_light.json",
              "data/gercekciisik/loot_tables/blocks/modern_ring_light.json",
              "data/gercekciisik/loot_tables/blocks/horizontal_led_strip.json",
              "data/gercekciisik/loot_tables/blocks/vertical_led_strip.json",
          ]
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              missing = [p for p in required if p not in names]
              assert not missing, f"JAR is missing required files: {missing}"
              meta = z.read("META-INF/mods.toml").decode("utf-8")
              assert 'version="0.1.1"' in meta, "JAR mod version is not 0.1.1"
              for name in names:
                  if name.endswith(".json"):
                      json.loads(z.read(name).decode("utf-8"))
              for ident in ["traditional_fluorescent","modern_fluorescent","square_spot","round_spot","traditional_ring_light","modern_ring_light","horizontal_led_strip","vertical_led_strip"]:
                  loot = json.loads(z.read(f"data/gercekciisik/loot_tables/blocks/{ident}.json").decode("utf-8"))
                  assert loot["pools"][0]["entries"][0]["name"] == f"gercekciisik:{ident}", f"Bad loot table for {ident}"
              emitter = json.loads(z.read("assets/gercekciisik/light/emitters.json").decode("utf-8"))
              traditional = emitter["gercekciisik:traditional_fluorescent"]["variants"]
              modern = emitter["gercekciisik:modern_fluorescent"]["variants"]
              assert len(traditional) == 4, f"Unexpected traditional emitter rules: {len(traditional)}"
              assert len(modern) == 36, f"Unexpected modern emitter rules: {len(modern)}"
              assert all(item["color"] == "auto" for item in traditional[:-1])
              assert all(item["color"] == "auto" for item in modern[:-1])
              assert traditional[-1]["state"] == "powered=false" and traditional[-1]["color"] == "#000000;0"
              assert modern[-1]["state"] == "powered=false" and modern[-1]["color"] == "#000000;0"
              assert sum(1 for item in modern if "nbt" in item) == 19
              for ident in ["square_spot", "round_spot", "traditional_ring_light", "modern_ring_light",
                            "horizontal_led_strip", "vertical_led_strip"]:
                  entry = emitter[f"gercekciisik:{ident}"]
                  assert entry["default"] == "auto", f"{ident} should sample dynamically"
                  assert any(item["state"] == "powered=false" and item["color"] == "#000000;0"
                             for item in entry["variants"])
              pngs = [n for n in names if n.endswith(".png") and n.startswith("assets/gercekciisik/")]
              for name in pngs:
                  data = z.read(name)
                  assert data.startswith(b"\x89PNG\r\n\x1a\n"), f"Invalid PNG signature: {name}"
                  pos, idat, seen_iend = 8, bytearray(), False
                  while pos < len(data):
                      length = struct.unpack(">I", data[pos:pos+4])[0]
                      typ = data[pos+4:pos+8]
                      part = data[pos+8:pos+8+length]
                      stored_crc = struct.unpack(">I", data[pos+8+length:pos+12+length])[0]
                      calc_crc = zlib.crc32(typ + part) & 0xffffffff
                      assert stored_crc == calc_crc, f"Bad PNG CRC: {name}"
                      if typ == b"IDAT":
                          idat.extend(part)
                      if typ == b"IEND":
                          seen_iend = True
                          break
                      pos += 12 + length
                  assert seen_iend and idat, f"PNG is incomplete: {name}"
                  zlib.decompress(bytes(idat))
          print(f"Verified {jar}: required classes/models, JSON, and PNG resources are valid.")
          PY
      - name: Prepare JAR with requested filenames
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" "Gerçekçi Işıklandırma Modu 0.1.1.jar"
          cp "$JAR" "Gercekci-Isiklandirma-Modu-0.1.1.jar"
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gercekci-isiklandirma-0.1.1
          path: |
            Gerçekçi Işıklandırma Modu 0.1.1.jar
            Gercekci-Isiklandirma-Modu-0.1.1.jar
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct JAR download
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release-jar]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Gerçekçi Işıklandırma Modu 0.1.1 (build ${{ github.run_number }})"
          body: |
            Minecraft Java 1.20.1 + Forge 47.2.0 test build.
            Compiled by GitHub Actions using Java 17.
            This build has not been tested in-game by the workflow.
          files: "Gercekci-Isiklandirma-Modu-0.1.1.jar"
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
